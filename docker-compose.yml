name: attestor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: attestor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attestor_local_dev_only}
      POSTGRES_DB: attestor
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attestor -d attestor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-attestor_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-attestor_local_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4.8.1
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local_dev_only}
      POSTGRES_DB: keycloak
    volumes:
      - kc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local_dev_only}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_dev_only}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # As of Keycloak 26, health endpoints are OFF by default and live on
      # a separate management interface (port 9000), not the main HTTP
      # port. Both of these were missing before, which is the real reason
      # the old healthcheck was hitting a route that didn't behave the way
      # it assumed.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # curl is not present in this image (verified by exec'ing in and
      # checking) — bash is, and it's confirmed present since Keycloak's
      # own startup scripts assume it. This exact command was run
      # interactively against the live container and confirmed to return
      # HTTP/1.1 200 OK with {"status":"UP"} before being wired in here.
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://attestor:${POSTGRES_PASSWORD:-attestor_local_dev_only}@postgres:5432/attestor
      - LANGGRAPH_CHECKPOINTER_DSN=postgresql://attestor:${POSTGRES_PASSWORD:-attestor_local_dev_only}@postgres:5432/attestor
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-attestor_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-attestor_local_dev_only}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=attestor
      - KEYCLOAK_CLIENT_ID=attestor-api
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JUDGE_PROVIDER=${JUDGE_PROVIDER:-groq}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-attestor}
      - ENV=local
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://attestor:${POSTGRES_PASSWORD:-attestor_local_dev_only}@postgres:5432/attestor
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-attestor_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-attestor_local_dev_only}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JUDGE_PROVIDER=${JUDGE_PROVIDER:-groq}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-attestor}
      - ENV=local
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.gateway.worker.WorkerSettings

  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://attestor:${POSTGRES_PASSWORD:-attestor_local_dev_only}@postgres:5432/attestor
    volumes:
      - ./app/core:/app/app/core
      - ./app/models:/app/app/models
      - ./mcp_server:/app/mcp_server
    depends_on:
      postgres:
        condition: service_healthy
    # No exposed port by default: FastMCP here runs over stdio for local
    # Claude Desktop / Claude Code integration, not as a network service.
    # If you want it reachable over HTTP for a remote MCP client instead,
    # that's a real config change (fastmcp.run(transport="http", ...)) —
    # not just adding a ports: entry, since stdio and HTTP transports are
    # started differently.
    stdin_open: true
    tty: true

volumes:
  pg_data:
  kc_pg_data:
  qdrant_data:
  minio_data:
