[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attestor"
version = "0.1.0"
description = "Model-risk governance and evaluation platform for GenAI/agentic models, built for the SR 26-2 regime."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "greenlet==3.1.1",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "psycopg2-binary==2.9.9",
    "redis==5.1.1",
    "arq==0.26.1",
    "qdrant-client==1.11.3",
    "flashrank==0.2.9",
    "pypdf==5.0.1",
    "pdfplumber==0.11.4",
    "python-docx==1.1.2",
    "python-pptx==1.0.2",
    "beautifulsoup4==4.12.3",
    "anthropic==0.36.1",
    "groq==0.11.0",
    "langgraph==0.2.39",
    "langchain-core==0.3.10",
    "langsmith==0.1.137",
    "logfire[fastapi,sqlalchemy]==4.39.0",
    "importlib_metadata==8.5.0",
    "ragas==0.2.5",
    "nemoguardrails==0.11.0",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "slowapi==0.1.9",
    "boto3==1.35.36",
    "tenacity==8.5.0",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "bandit==1.7.10",
    "httpx==0.27.2",
    "faker==30.3.0",
    "aiosqlite==0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
